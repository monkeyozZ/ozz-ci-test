name: ozz-local-api

x-server: &server
  image: rancher/k3s@sha256:96758bd78415cefa8a3e404800e2bc0561d74d6234f48feb86fbbc8d43bdf4e2
  pull_policy: never
  # Nested K3s needs cgroup/mount privileges inside Docker Desktop's Linux VM.
  # No host directory, Docker socket, host network, or unrelated volume is mounted.
  privileged: true
  cgroup: private
  hostname: ozz-node
  command:
    - server
    - --node-name=ozz-node
    - --tls-san=127.0.0.1
    - --write-kubeconfig-mode=0600
    - --secrets-encryption
  mem_limit: 2g
  cpus: 2
  pids_limit: 2048
  tmpfs:
    - /run:rw,exec,nosuid,size=256m
    - /var/run:rw,exec,nosuid,size=256m
    - /tmp:rw,exec,nosuid,size=256m
  stop_grace_period: 45s
  restart: 'no'
  labels:
    dev.ozz.owner: local-lab
    dev.ozz.scope: local-kubernetes-api-only
  healthcheck:
    test: [CMD, /bin/k3s, kubectl, get, --raw=/readyz]
    interval: 5s
    timeout: 5s
    retries: 36
    start_period: 15s
  logging:
    driver: json-file
    options:
      max-size: '5m'
      max-file: '3'

services:
  a:
    <<: *server
    container_name: ozz-local-api-a
    ports:
      - '127.0.0.1:16443:6443'
      - '127.0.0.1:18080:80'
      - '127.0.0.1:18443:443'
    networks: [a]
    volumes:
      - a-data:/var/lib/rancher/k3s
      - a-kubelet:/var/lib/kubelet
      - a-cni:/var/lib/cni
      - a-logs:/var/log
  b:
    <<: *server
    container_name: ozz-local-api-b
    ports:
      - '127.0.0.1:26443:6443'
      - '127.0.0.1:28080:80'
      - '127.0.0.1:28443:443'
    networks: [b]
    volumes:
      - b-data:/var/lib/rancher/k3s
      - b-kubelet:/var/lib/kubelet
      - b-cni:/var/lib/cni
      - b-logs:/var/log

networks:
  a:
    labels: { dev.ozz.owner: local-lab }
  b:
    labels: { dev.ozz.owner: local-lab }

volumes:
  a-data:
    labels: { dev.ozz.owner: local-lab }
  a-kubelet:
    labels: { dev.ozz.owner: local-lab }
  a-cni:
    labels: { dev.ozz.owner: local-lab }
  a-logs:
    labels: { dev.ozz.owner: local-lab }
  b-data:
    labels: { dev.ozz.owner: local-lab }
  b-kubelet:
    labels: { dev.ozz.owner: local-lab }
  b-cni:
    labels: { dev.ozz.owner: local-lab }
  b-logs:
    labels: { dev.ozz.owner: local-lab }
