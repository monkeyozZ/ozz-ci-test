name: Control plane and Console

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Create isolated random local configuration
        run: pnpm dev:setup
      - name: Start PostgreSQL and Redis
        run: pnpm dev:infra
      - name: Build, typecheck, lint, format and unit tests
        run: pnpm check
      - name: Migrate the empty database
        run: pnpm db:migrate
      - name: Generate and verify API contract
        run: |
          pnpm api:generate
          git diff --exit-code -- docs/openapi.json packages/api-client/src/schema.ts
      - name: Real PostgreSQL, Redis, security and recovery tests
        run: pnpm test:integration
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
      - name: Initialize the isolated browser-test administrator
        run: pnpm admin:init --username admin --password-file .secrets/admin-password
      - name: Install Chromium
        id: browser_setup
        run: pnpm --filter @ozz/console exec playwright install --with-deps chromium
      - name: Interactive prototype browser tests
        id: prototype
        env:
          OZZ_PROTO_OUTPUT_DIR: apps/console/tests/artifacts/console-v3-prototype
        run: pnpm test:prototype
      - name: Console interaction tests with controlled API fixtures
        id: console_fixtures
        if: ${{ !cancelled() && steps.browser_setup.outcome == 'success' }}
        env:
          S6_UI_RUN_ID: ci-fixtures
        run: pnpm test:console-fixtures
      - name: Collect fixture responsive evidence
        if: always() && steps.console_fixtures.outcome != 'skipped'
        run: |
          node --input-type=module <<'NODE'
          import { existsSync } from 'node:fs';
          import { copyFile, mkdir } from 'node:fs/promises';
          const root = 'apps/console/tests/artifacts';
          for (const [source, destination, files] of [
            ['s5-interface', 's5', ['responsive-results.json', 'snapshot-1440-light.png', 'snapshot-390-dark.png']],
            ['s6-interface/ci-fixtures', 's6', ['responsive-results.json', '1440-2.png', '390-3.png']],
          ]) {
            for (const file of files) {
              const from = `${root}/${source}/${file}`;
              if (!existsSync(from)) continue;
              const to = `${root}/fixtures-ci/${destination}`;
              await mkdir(to, { recursive: true });
              await copyFile(from, `${to}/${file}`);
            }
          }
          NODE
      - name: Save prototype and fixture browser evidence
        if: always() && (steps.prototype.outcome != 'skipped' || steps.console_fixtures.outcome != 'skipped')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-v3-browser-evidence
          path: |
            apps/console/tests/artifacts/console-v3-prototype/
            apps/console/tests/artifacts/fixtures-ci/
          if-no-files-found: warn
          retention-days: 7
      - name: Browser tests against production assets
        id: browser_e2e
        if: ${{ !cancelled() && steps.browser_setup.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p .local
          pnpm --filter @ozz/api start > .local/ci-api.log 2>&1 &
          api_pid=$!
          pnpm --filter @ozz/worker start > .local/ci-worker.log 2>&1 &
          worker_pid=$!
          pnpm --filter @ozz/console preview --port 5173 --strictPort > .local/ci-console.log 2>&1 &
          console_pid=$!
          cleanup() { kill "$api_pid" "$worker_pid" "$console_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          pnpm exec node --input-type=module <<'NODE'
          import { setTimeout } from 'node:timers/promises';
          for (const url of ['http://127.0.0.1:3000/api/health/ready', 'http://127.0.0.1:3001/health/ready', 'http://127.0.0.1:5173']) {
            let ready = false;
            for (let i = 0; i < 60; i++) {
              try { ready = (await fetch(url, { signal: AbortSignal.timeout(1000) })).ok; } catch {}
              if (ready) break;
              await setTimeout(500);
            }
            if (!ready) throw new Error('A local test service did not become ready');
          }
          NODE
          pnpm test:e2e
      - name: Save browser evidence
        if: always() && steps.browser_e2e.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-browser-evidence
          path: |
            apps/console/tests/artifacts/results.json
            apps/console/test-results/
            apps/console/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop test infrastructure and preserve volumes until runner disposal
        if: always()
        run: docker compose --env-file .env -f compose.dev.yaml stop
